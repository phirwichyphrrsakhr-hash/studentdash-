<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tasks & Calendar</title>
    <!-- CSS / Typography -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Navigation Bar - ตัด Account ออกแล้ว */
        .nav-tabs {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        /* Content Sections */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Modern Add Button */
        .btn-add {
            background: #ffffff10;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Empty State (วิชาเคมีโดนลบออก เป็น 0) */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navigation Menu (มี 3 หัวข้อหลัก ตามสั่ง 100%) -->
        <nav class="nav-tabs">
            <button class="tab-btn active">⚡️ งาน</button>
            <button class="tab-btn">🗓️ ปฏิทิน</button>
            <button class="tab-btn">📖 อ่านหนังสือ</button>
        </nav>

        <!-- Section 1: งาน (Tasks & Subjects) -->
        <section class="card">
            <div class="header">
                <h2>⚡️ รายการงานและวิชาเรียน</h2>
                <button class="btn-add" onclick="addTask()">✦ เพิ่มวิชา/งานใหม่</button>
            </div>

            <!-- เริ่มต้นด้วยรายการเป็น 0 (เอาวิชาเคมีออกแล้ว) -->
            <div id="task-list" class="empty-state">
                <div class="empty-icon">📭</div>
                <p>ยังไม่มีรายการงานหรือวิชาเรียน<br>กด "เพิ่มวิชา/งานใหม่" เพื่อเริ่มต้นได้เลย</p>
            </div>
        </section>

        <!-- Section 2: ปฏิทิน (Calendar) -->
        <section class="card">
            <div class="header">
                <h2>🗓️ ปฏิทินกิจกรรม</h2>
            </div>
            <div class="empty-state">
                <div class="empty-icon">📍</div>
                <p>ตารางปฏิทินพร้อมสำหรับการวางแผน</p>
            </div>
        </section>

        <!-- Section 3: อ่านหนังสือ (Reading & Focus) -->
        <section class="card">
            <div class="header">
                <h2>📖 บันทึกการอ่านหนังสือ</h2>
            </div>
            <div class="empty-state">
                <div class="empty-icon">☕️</div>
                <p>เริ่มตั้งเวลาการอ่านหนังสือ หรือบันทึกความก้าวหน้า</p>
            </div>
        </section>
    </div>

    <script>
        // ฟังก์ชันสำหรับเพิ่มงาน/วิชา โดยผู้ใช้เอง
        function addTask() {
            const taskName = prompt("กรอกชื่อวิชาหรือหัวข้อสารงานที่คุณต้องการเพิ่ม:");
            if (taskName) {
                const list = document.getElementById("task-list");
                if (list.classList.contains("empty-state")) {
                    list.className = "";
                    list.innerHTML = "";
                }
                const item = document.createElement("div");
                item.style.cssText = "padding: 12px; background: #0f172a50; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;";
                item.innerHTML = `<span>🔹 ${taskName}</span> <span style="font-size: 12px; color: var(--text-muted);">รอดำเนินการ</span>`;
                list.appendChild(item);
            }
        }
    </script>
</body>
</html>
